[mypy]
# 增量式类型门禁：先覆盖已完成标注的模块，随 crawler.py 等大文件拆分推进逐步加入。
# 本次已把判定逻辑抽成 _evaluate_response 纯函数，并补全 crawler.py 的类型标注，
# 故将其纳入门禁（之前因隐式 Optional 未修、且尚未拆分而临时排除）。
files = config.py, logger.py, database.py, wbi_sign.py, crawler.py

# 第三方库（httpx / requests）无类型桩时不报错
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
follow_imports = silent
