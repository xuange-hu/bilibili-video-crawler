[mypy]
# 增量式类型门禁：先覆盖已完成标注的模块（config / logger / database / wbi_sign），
# 随 crawler.py 等大文件拆分推进再逐步把文件加入 files 列表。
files = config.py, logger.py, database.py, wbi_sign.py

# 第三方库（httpx / requests）无类型桩时不报错
ignore_missing_imports = True
warn_unused_configs = True
warn_redundant_casts = True
follow_imports = silent
